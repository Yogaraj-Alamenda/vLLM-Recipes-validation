name: Nightly Xeon Recipe Validation

on:
  schedule:
    # 08:00 UTC daily: ~1:00 AM Pacific during daylight saving time,
    # and ~12:00 AM Pacific during standard time.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "(optional) Exact model ID; leave empty to test all Xeon6 recipes"
        required: false
        default: ""
      vllm_image:
        description: "(optional) Official vLLM CPU image"
        required: false
        default: "vllm/vllm-openai-cpu:nightly"
      recipe_api_base:
        description: "(optional) Recipes API base URL (production or Vercel preview)"
        required: false
        default: "https://recipes.vllm.ai"
      vllm_env_vars:
        description: "(optional) Non-secret KEY=VALUE pairs for every model container (space/newline separated)"
        required: false
        default: ""
      recipe_tools_repo:
        description: "(optional) vLLM GitHub clone URL; empty uses image-bundled recipe tools"
        required: false
        default: ""
      recipe_tools_ref:
        description: "(optional) Recipe tools branch, tag, or commit (used only when repository is set)"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: nightly-xeon6-recipes
  cancel-in-progress: false

jobs:
  validate:
    # Change labels to match the Intel internal self-hosted runner registration.
    runs-on: [self-hosted, linux, x64, xeon4, recipe-validation]
    timeout-minutes: 10080 # 7 days; all-model validation may be long.

    env:
      # Optional repo variable. When unset, settings.env falls back to
      # $HOME/.cache/huggingface on the self-hosted runner.
      HF_HOME: ${{ vars.HF_HOME }}
      # HF_TOKEN should be stored as an internal-repo/environment secret if gated
      # models are part of the Xeon recipe catalog.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RECIPE_TOOLS_REPO: ${{ inputs.recipe_tools_repo }}
      RECIPE_TOOLS_REF: ${{ inputs.recipe_tools_ref || 'main' }}
      TEST_MODEL: ${{ inputs.model || '' }}
      # Scheduled runs do not populate workflow_dispatch input defaults.
      # Keep the nightly image as an explicit cron-safe fallback here.
      VLLM_IMAGE: ${{ inputs.vllm_image || 'vllm/vllm-openai-cpu:nightly' }}
      RECIPES_BASE_URL: ${{ inputs.recipe_api_base || 'https://recipes.vllm.ai' }}
      # Keep nightly known-good state separate from the weekly/stable catalog.
      VALIDATED_BRANCH: validated-xeon6-nightly
      BENCH_NUM_PROMPTS: "5"
      # Optional non-secret environment variables for every model container.
      VLLM_TEST_ENV_VARS: ${{ inputs.vllm_env_vars || '' }}
      # Unique history key. Rerunning the same Actions run creates a new attempt.
      VALIDATION_RUN_ID: nightly-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}

    steps:
      # Repair disposable directories created by older root-running containers.
      # This must happen BEFORE checkout because checkout cleans the old worktree.
      # New test scratch is outside GITHUB_WORKSPACE (see next step).
      - name: Remove legacy container-owned workspace directories
        shell: bash
        run: |
          set -euo pipefail
          for legacy in \
            "$GITHUB_WORKSPACE/triton-results" \
            "$GITHUB_WORKSPACE/work" \
            "$GITHUB_WORKSPACE/results"; do
            [[ -e "$legacy" ]] || continue
            echo "Cleaning legacy checkout path: $legacy"
            if ! rm -rf -- "$legacy" 2>/dev/null; then
              # Docker-root can repair files even if runner sudo is unavailable.
              image=""
              for candidate in \
                vllm/vllm-openai-cpu:nightly-x86_64 \
                vllm/vllm-openai-cpu:nightly \
                vllm/vllm-openai-cpu:latest-x86_64; do
                if docker image inspect "$candidate" >/dev/null 2>&1; then
                  image="$candidate"
                  break
                fi
              done
              if [[ -n "$image" ]]; then
                docker run --rm --user 0:0 --entrypoint /bin/sh \
                  -v "$legacy:/repair" "$image" \
                  -c 'chown -R "$1:$2" /repair' _ "$(id -u)" "$(id -g)"
              else
                sudo -n chown -R "$(id -u):$(id -g)" "$legacy" || {
                  echo "::error::No cached repair image or passwordless sudo to fix $legacy"
                  exit 1
                }
              fi
              rm -rf -- "$legacy"
            fi
          done

      - name: Initialize isolated scratch directories
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/xeon6-nightly-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$scratch/work" "$scratch/results"
          echo "WORK_ROOT=$scratch/work" >> "$GITHUB_ENV"
          echo "RESULT_ROOT=$scratch/results" >> "$GITHUB_ENV"

      - name: Checkout validation harness
        uses: actions/checkout@v6

      - name: Check Hugging Face configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Hugging Face configuration ==="

          # HF_TOKEN is required because the Xeon recipe catalog may include
          # gated models such as Meta Llama. Never print the secret value.
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::HF_TOKEN repository secret is not configured"
            exit 1
          fi
          echo "HF_TOKEN: configured"

          # Prefer the HF_HOME repository variable. If it is unset, resolve a
          # persistent runner-local default and export it for all later steps.
          if [[ -z "${HF_HOME:-}" ]]; then
            RESOLVED_HF_HOME="${HOME}/.cache/huggingface"
            echo "::warning::HF_HOME repository variable is not configured; using ${RESOLVED_HF_HOME}"
          else
            RESOLVED_HF_HOME="${HF_HOME}"
          fi

          if [[ "${RESOLVED_HF_HOME}" != /* ]]; then
            echo "::error::HF_HOME must be an absolute path: ${RESOLVED_HF_HOME}"
            exit 1
          fi

          mkdir -p "${RESOLVED_HF_HOME}"

          # Allow each self-hosted runner to map ~/.cache/huggingface to its
          # own backing storage with a symbolic link. Resolve the real path
          # before exporting HF_HOME so Docker bind-mounts the backing directory.
          RESOLVED_HF_HOME="$(readlink -f "${RESOLVED_HF_HOME}")"
          echo "Resolved HF_HOME: ${RESOLVED_HF_HOME}"

          TEST_FILE="${RESOLVED_HF_HOME}/.github-runner-write-test"
          touch "${TEST_FILE}"
          rm -f "${TEST_FILE}"

          # Make the resolved value available to weekly.sh and later steps.
          echo "HF_HOME=${RESOLVED_HF_HOME}" >> "${GITHUB_ENV}"

          echo "HF_HOME: ${RESOLVED_HF_HOME}"
          echo "HF_HOME is writable."
          echo
          echo "=== Hugging Face cache filesystem ==="
          df -h "${RESOLVED_HF_HOME}"

      - name: Restore last known-good validated catalog
        run: ./scripts/hydrate_validated.sh

      - name: Run Xeon recipe tests
        id: test
        continue-on-error: true
        run: ./scripts/weekly.sh

      - name: Restore scratch ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Never chown the shared HF_HOME cache.
          if docker image inspect "$VLLM_IMAGE" >/dev/null 2>&1; then
            for dir in "$WORK_ROOT" "$RESULT_ROOT"; do
              [[ -d "$dir" ]] || continue
              docker run --rm --user 0:0 --entrypoint /bin/sh \
                -v "$dir:/repair" "$VLLM_IMAGE" \
                -c 'chown -R "$1:$2" /repair' _ "$(id -u)" "$(id -g)"
            done
          fi

      - name: Show validation summary
        if: always()
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import shlex
          from pathlib import Path

          summary_path = Path(os.environ["RESULT_ROOT"]) / "weekly-summary.json"
          system_info_path = Path(os.environ["RESULT_ROOT"]) / "system-info.txt"
          out = Path(os.environ["GITHUB_STEP_SUMMARY"])

          def md_escape(value):
              return str(value).replace("|", "\\|").replace("\n", " ")

          def parse_lscpu(text):
              marker = "===== lscpu ====="
              if marker not in text:
                  return {}
              section = text.split(marker, 1)[1]
              if "===== " in section:
                  section = section.split("===== ", 1)[0]
              fields = {}
              for line in section.splitlines():
                  if ":" not in line:
                      continue
                  key, value = line.split(":", 1)
                  key = key.strip()
                  value = value.strip()
                  if key and value:
                      fields[key] = value
              return fields

          def display_env_overrides(raw):
              if not raw.strip():
                  return "(none)"
              try:
                  items = shlex.split(raw)
              except ValueError:
                  return md_escape(raw)

              sensitive = re.compile(
                  r"(TOKEN|SECRET|PASSWORD|PASSWD|API[_-]?KEY|PRIVATE|CREDENTIAL)",
                  re.IGNORECASE,
              )
              rendered = []
              for item in items:
                  if "=" not in item:
                      rendered.append(f"`{md_escape(item)}`")
                      continue
                  name, value = item.split("=", 1)
                  if sensitive.search(name):
                      value = "***"
                  rendered.append(f"`{md_escape(name)}={md_escape(value)}`")
              return "<br>".join(rendered) if rendered else "(none)"

          system_info = (
              system_info_path.read_text(errors="replace")
              if system_info_path.exists()
              else ""
          )
          lscpu = parse_lscpu(system_info)
          hostname = "unknown"
          for line in system_info.splitlines():
              if line.startswith("hostname="):
                  hostname = line.split("=", 1)[1].strip() or "unknown"
                  break

          cpu_id = "; ".join(
              part
              for part in (
                  lscpu.get("Vendor ID"),
                  f"family {lscpu['CPU family']}" if lscpu.get("CPU family") else None,
                  f"model {lscpu['Model']}" if lscpu.get("Model") else None,
                  f"stepping {lscpu['Stepping']}" if lscpu.get("Stepping") else None,
              )
              if part
          ) or "unknown"
          topology = (
              f"{lscpu.get('Socket(s)', 'unknown')} socket(s), "
              f"{lscpu.get('Core(s) per socket', 'unknown')} cores/socket, "
              f"{lscpu.get('CPU(s)', 'unknown')} logical CPUs, "
              f"{lscpu.get('NUMA node(s)', 'unknown')} NUMA node(s)"
          )

          if not summary_path.exists():
              out.write_text(
                  "# Nightly Xeon Recipe Validation\n\n"
                  "The validation summary was not generated. Check the failed "
                  "workflow step logs and uploaded artifacts.\n"
              )
              raise SystemExit(0)

          data = json.loads(summary_path.read_text())
          lines = [
              "# Nightly Xeon Recipe Validation",
              "",
              f"**Run:** `{data.get('run_id', 'unknown')}`  ",
              f"**Generated:** `{data.get('generated_at', 'unknown')}`  ",
              f"**Recipe tools source:** `{data.get('recipe_tools', {}).get('source', 'unknown')}`  ",
              f"**Recipe tools repository:** `{data.get('recipe_tools', {}).get('repository') or 'image-bundled'}`  ",
              f"**Recipe tools ref / commit:** `{data.get('recipe_tools', {}).get('ref') or '-'} / {data.get('recipe_tools', {}).get('commit') or '-'}`",
              "",
              "## Run configuration",
              "",
              "| Setting | Value |",
              "| --- | --- |",
              f"| Docker image | `{md_escape(os.environ.get('VLLM_IMAGE', 'unknown'))}` |",
              f"| Recipes URL | `{md_escape(os.environ.get('RECIPES_BASE_URL', 'unknown'))}` |",
              f"| Additional container env | {display_env_overrides(os.environ.get('VLLM_TEST_ENV_VARS', ''))} |",
              f"| Benchmark prompts | `{md_escape(os.environ.get('BENCH_NUM_PROMPTS', 'unknown'))}` |",
              "",
              "## System",
              "",
              "| Setting | Value |",
              "| --- | --- |",
              f"| Host | `{md_escape(hostname)}` |",
              f"| CPU model | `{md_escape(lscpu.get('Model name', 'unknown'))}` |",
              f"| CPU ID | `{md_escape(cpu_id)}` |",
              f"| Topology | `{md_escape(topology)}` |",
              "",
              "| Tested | Passed | Failed |",
              "| ---: | ---: | ---: |",
              f"| {data.get('tested', 0)} | {data.get('passed', 0)} | {data.get('failed', 0)} |",
              "",
              "## Models",
              "",
              "| Model | Status | Convert | Startup | Benchmark | P99 TTFT ms | P99 TPOT ms | Output tok/s | Error |",
              "| --- | --- | --- | --- | --- | ---: | ---: | ---: | --- |",
          ]

          for r in data.get("models", []):
              status = str(r.get("status", "UNKNOWN"))
              icon = "✅" if status == "PASS" else "❌"
              stages = r.get("stages", {})
              metrics = r.get("metrics", {})
              error = str(r.get("error", "")).replace("|", "\\|").replace("\n", " ")
              if len(error) > 180:
                  error = error[:177] + "..."
              lines.append(
                  "| `{}` | {} {} | {} | {} | {} | {} | {} | {} | {} |".format(
                      r.get("model", "unknown"),
                      icon,
                      status,
                      stages.get("conversion", "-"),
                      stages.get("startup", "-"),
                      stages.get("benchmark", "-"),
                      metrics.get("p99_ttft_ms", "-"),
                      metrics.get("p99_tpot_ms", "-"),
                      metrics.get("output_throughput", "-"),
                      error or "-",
                  )
              )

          run_date = data.get("run_date")
          run_id = data.get("run_id")
          if run_date and run_id:
              branch_url = (
                  f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/"
                  f"{os.environ.get('GITHUB_REPOSITORY', '')}/tree/validated-xeon6-nightly/"
                  f"history/{run_date}/{run_id}"
              )
              lines += [
                  "",
                  f"Historical run files: [{run_date}/{run_id}]({branch_url})",
                  "",
                  "The full HTML report and per-model logs are also included in the workflow artifact.",
              ]

          out.write_text("\n".join(lines) + "\n")
          PY

      - name: Upload nightly results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xeon6-nightly-${{ github.run_number }}
          path: |
            ${{ env.RESULT_ROOT }}/
            history/**/${{ env.VALIDATION_RUN_ID }}/
          retention-days: 90

      - name: Upload latest validated bundles
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xeon6-nightly-validated-${{ github.run_number }}
          path: validated/
          retention-days: 90

      - name: Publish latest nightly known-good catalog
        if: always()
        run: ./scripts/publish_validated.sh

      - name: Cleanup Docker disk usage
        if: always()
        shell: bash
        run: |
          # Only remove this attempt's scratch; never the persistent HF cache.
          for dir in "${WORK_ROOT:-}" "${RESULT_ROOT:-}"; do
            [[ -n "$dir" && -d "$dir" ]] || continue
            rm -rf -- "$dir" || echo "::warning::Could not remove $dir"
          done

          echo "=== Docker disk usage before cleanup ==="
          docker system df || true

          # Test containers are normally removed by the validation harness.
          # Prune leftovers from interrupted runs and dangling image layers,
          # including superseded layers from moving tags such as :nightly.
          docker container prune -f || true
          docker image prune -f || true

          echo "=== Docker disk usage after cleanup ==="
          docker system df || true

      - name: Fail job if any model failed
        if: steps.test.outcome == 'failure'
        run: exit 1
